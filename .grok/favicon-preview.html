<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #666; }
  .row { display: flex; gap: 16px; padding: 16px; align-items: center; }
  .tile { background: #fff; display: grid; place-items: center; }
</style>
</head>
<body>
  <div class="row">
    <div class="tile" style="width:16px;height:16px"><img src="file:///workspace/public/favicon.svg" width="16" height="16"></div>
    <div class="tile" style="width:32px;height:32px"><img src="file:///workspace/public/favicon.svg" width="32" height="32"></div>
    <div class="tile" style="width:64px;height:64px"><img src="file:///workspace/public/favicon.svg" width="64" height="64"></div>
    <div class="tile" style="width:128px;height:128px"><img src="file:///workspace/public/favicon.svg" width="128" height="128"></div>
  </div>
</body>
</html>
